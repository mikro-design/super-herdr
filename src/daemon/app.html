<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Super-Herdr</title>
<style>
  :root {
    --bg: #11131a; --panel: #171a23; --line: #262b38;
    --text: #e6e9f0; --dim: #8b93a7; --accent: #6ea8fe;
    --wait: #ffb454; --work: #6ee7a8; --gone: #6b7280;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fa; --panel: #fff; --line: #dfe3ec;
      --text: #12151c; --dim: #5b6376; --accent: #2563eb;
      --wait: #b45309; --work: #047857; --gone: #6b7280;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 ui-sans-serif, -apple-system, system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; gap: .6rem;
    align-items: baseline; padding: .85rem 1rem; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 620; letter-spacing: .01em; }
  #link { margin-left: auto; font-size: .78rem; color: var(--dim); }
  #link.live { color: var(--work); }
  #link.down { color: var(--wait); }
  main { padding: 1rem; max-width: 46rem; margin: 0 auto; }
  h2 {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 1.6rem 0 .6rem; font-weight: 600;
  }
  h2:first-child { margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: .7rem; margin-bottom: .45rem; padding: .7rem .85rem;
  }
  li.tap { cursor: pointer; }
  li.tap:active { border-color: var(--accent); }
  .row { display: flex; gap: .5rem; align-items: baseline; }
  .name { font-weight: 560; }
  .where { color: var(--dim); font-size: .82rem; margin-left: auto; text-align: right; }
  .note { color: var(--dim); font-size: .82rem; }
  .badge {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
    padding: .13rem .42rem; border-radius: .35rem; border: 1px solid currentColor;
  }
  .wait { color: var(--wait); } .work { color: var(--work); } .gone { color: var(--gone); }
  .unread { box-shadow: inset 3px 0 0 var(--wait); }
  .empty { color: var(--dim); padding: .6rem .1rem; }
  button {
    font: inherit; color: var(--accent); background: none;
    border: 1px solid var(--line); border-radius: .55rem;
    padding: .35rem .7rem; cursor: pointer;
  }
  .actions { display: flex; gap: .5rem; margin-top: .7rem; }
  #version { font-size: .72rem; color: var(--dim); }
  #pairing { padding: 1rem; max-width: 26rem; margin: 0 auto; }
  #pairing label { display: block; margin: .8rem 0; color: var(--dim); font-size: .82rem; }
  #pairing input {
    display: block; width: 100%; margin-top: .3rem; padding: .6rem .7rem;
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: .55rem;
  }
  #code { text-transform: uppercase; letter-spacing: .12em; font-family: ui-monospace, monospace; }
  #pair-error { color: var(--wait); min-height: 1.2em; }
  /* The screen keeps a terminal's own dark ground in either colour scheme: a
     program chose its colours against black, and re-grounding them on white
     would misreport what the pane looks like. */
  .screen {
    position: relative; overflow-x: auto; background: #0b0d12; color: #d6dae4;
    border: 1px solid var(--line); border-radius: .7rem; padding: .6rem .7rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.25; white-space: pre; font-size: 13px;
  }
  .screen .line { min-height: 1.25em; }
  .screen .cursor {
    position: absolute; background: var(--accent); opacity: .6; pointer-events: none;
  }
  #viewing { font-family: ui-monospace, monospace; text-transform: none; letter-spacing: 0; }
  #screen-note { align-self: center; }
</style>

<header>
  <h1>Super-Herdr</h1>
  <span id="version"></span>
  <span id="link">connecting…</span>
</header>
<section id="pairing" hidden>
  <h2>Pair this device</h2>
  <p class="note">
    Ask the terminal client for a pairing code, then enter it here. The code is
    good once and expires in a few minutes.
  </p>
  <label>Code <input id="code" autocomplete="off" autocapitalize="characters"
    spellcheck="false" placeholder="ABCD-2345"></label>
  <label>Name this device <input id="name" autocomplete="off"
    placeholder="phone"></label>
  <div class="actions"><button id="pair">Pair</button></div>
  <p class="note" id="pair-error"></p>
</section>
<main hidden>
  <h2>Waiting for you</h2>
  <ul id="waiting"><li class="empty">nothing waiting</li></ul>

  <h2>Recent</h2>
  <ul id="history"><li class="empty">no transitions yet</li></ul>
  <div class="actions"><button id="mark">Mark all read</button></div>

  <h2>Panes</h2>
  <ul id="panes"><li class="empty">no panes</li></ul>

  <section id="viewer" hidden>
    <h2><span id="viewing"></span></h2>
    <div id="screen" class="screen"></div>
    <div class="actions">
      <button id="stop">Stop watching</button>
      <span class="note" id="screen-note"></span>
    </div>
  </section>

  <h2>Federation</h2>
  <ul id="targets"><li class="empty">no targets</li></ul>
</main>

<script>
// One session joins the event stream to the commands that steer it. The daemon
// keys its attachment on this, so a second tab is a second client rather than
// two halves of one.
const session = (crypto.randomUUID && crypto.randomUUID() || String(Math.random()).slice(2))
  .replace(/[^a-zA-Z0-9-]/g, '');

// The daemon's own vocabulary, mirrored here. Nothing is derived locally: the
// federation and the attention history are what the daemon last said they were.
const targets = new Map();
let history = [];

const el = id => document.getElementById(id);
const text = value => String(value == null ? '' : value);

function send(message) {
  return fetch(`/command?session=${session}`, {
    method: 'POST',
    body: JSON.stringify(message),
  });
}

function qualify(pane) {
  return `${pane.target}/${pane.session}`;
}

function phase(status) {
  const value = text(status).toLowerCase();
  if (['blocked', 'waiting', 'waiting_for_input', 'needs_input', 'ready'].includes(value)) return 'wait';
  if (['working', 'running', 'busy', 'active'].includes(value)) return 'work';
  return 'gone';
}

function renderWaiting() {
  const rows = [];
  for (const runtime of targets.values()) {
    const snapshot = runtime.snapshot;
    if (!snapshot || runtime.connection !== 'live') continue;
    for (const agent of snapshot.agents || []) {
      const status = agent.status || '';
      if (phase(status) !== 'wait' && !agent.interactive_ready) continue;
      rows.push({
        name: agent.name || agent.agent || 'agent',
        status,
        where: qualify(agent.pane),
      });
    }
  }
  const list = el('waiting');
  list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = '<li class="empty">nothing waiting</li>';
    return;
  }
  for (const row of rows) {
    const item = document.createElement('li');
    item.innerHTML = `<div class="row">
        <span class="name"></span>
        <span class="badge wait"></span>
        <span class="where"></span>
      </div>`;
    item.querySelector('.name').textContent = row.name;
    item.querySelector('.badge').textContent = row.status || 'waiting';
    item.querySelector('.where').textContent = row.where;
    list.append(item);
  }
}

function renderHistory() {
  const list = el('history');
  list.innerHTML = '';
  const recent = history.slice(-40).reverse();
  if (!recent.length) {
    list.innerHTML = '<li class="empty">no transitions yet</li>';
    return;
  }
  for (const event of recent) {
    const item = document.createElement('li');
    item.className = 'tap' + (event.unread ? ' unread' : '');
    item.innerHTML = `<div class="row">
        <span class="name"></span>
        <span class="badge"></span>
        <span class="where"></span>
      </div><div class="note"></div>`;
    item.querySelector('.name').textContent = event.agent || 'agent';
    const badge = item.querySelector('.badge');
    badge.textContent = text(event.kind).replace(/_/g, ' ');
    badge.classList.add(phase(event.status));
    item.querySelector('.where').textContent = qualify(event.pane);
    item.querySelector('.note').textContent =
      `${text(event.workspace)} · ${text(event.status)}`;
    // Reading it here marks it read everywhere, because the history belongs to
    // the daemon rather than to this page.
    item.onclick = () => send({ type: 'attention.mark_seen', pane: event.pane });
    list.append(item);
  }
}

function renderTargets() {
  const list = el('targets');
  list.innerHTML = '';
  if (!targets.size) {
    list.innerHTML = '<li class="empty">no targets</li>';
    return;
  }
  for (const [key, runtime] of [...targets.entries()].sort()) {
    const snapshot = runtime.snapshot;
    const item = document.createElement('li');
    item.innerHTML = `<div class="row">
        <span class="name"></span>
        <span class="badge"></span>
        <span class="where"></span>
      </div><div class="note"></div>`;
    item.querySelector('.name').textContent = key;
    const badge = item.querySelector('.badge');
    const live = runtime.connection === 'live';
    badge.textContent = typeof runtime.connection === 'string'
      ? runtime.connection
      : Object.keys(runtime.connection)[0];
    badge.classList.add(live ? 'work' : 'wait');
    item.querySelector('.where').textContent = text(runtime.endpoint);
    const counts = snapshot && snapshot.counts;
    item.querySelector('.note').textContent = counts
      ? `${counts.workspaces} workspaces · ${counts.panes} panes · ${counts.agents} agents`
      : text(runtime.last_error) || 'no snapshot yet';
    list.append(item);
  }
}

// The pane being watched, and the screen the daemon last described. Nothing is
// derived locally: a diff that does not follow the update we hold is refused
// rather than guessed at, because a grid painted from a missed update stays
// wrong forever and says nothing about it.
let watching = null;
let screen = null;
let cell = null;

function sameId(left, right) {
  return left && right
    && left.target === right.target
    && left.session === right.session
    && left.resource === right.resource;
}

// This page's own default pair, kept in step with `.screen` in the stylesheet.
// Inverse over defaults is resolved against these.
const SCREEN_BG = '#0b0d12';
const SCREEN_FG = '#d6dae4';

// The sixteen the terminal names, as most terminals draw them.
const BASE = [
  '#000000', '#cd3131', '#0dbc79', '#e5e510', '#2472c8', '#bc3fbc', '#11a8cd', '#e5e5e5',
  '#666666', '#f14c4c', '#23d18b', '#f5f543', '#3b8eea', '#d670d6', '#29b8db', '#ffffff',
];

// Indexed colours arrive indexed rather than resolved, because the palette
// belongs to whoever displays them. This is that decision, made here.
function colour(value) {
  if (!value || value.kind === 'default') return null;
  if (value.kind === 'rgb') return `rgb(${value.red} ${value.green} ${value.blue})`;
  const index = value.index;
  if (index < 16) return BASE[index];
  if (index < 232) {
    const level = step => (step === 0 ? 0 : 55 + step * 40);
    const offset = index - 16;
    return `rgb(${level(Math.floor(offset / 36))} `
      + `${level(Math.floor(offset / 6) % 6)} ${level(offset % 6)})`;
  }
  const grey = 8 + (index - 232) * 10;
  return `rgb(${grey} ${grey} ${grey})`;
}

function runStyle(style) {
  if (!style) return '';
  const parts = [];
  let fg = colour(style.foreground);
  let bg = colour(style.background);
  // Inverse that a colour swap could not express: both sides were the
  // terminal's defaults, so the daemon sent the flag instead of two colours
  // that would have cancelled out. Exchanging our own defaults needs no palette
  // knowledge, which is exactly why it was left to us.
  if (style.inverse) {
    fg = bg || SCREEN_BG;
    bg = SCREEN_FG;
  }
  if (fg) parts.push(`color:${fg}`);
  if (bg) parts.push(`background:${bg}`);
  if (style.bold) parts.push('font-weight:700');
  if (style.dim) parts.push('opacity:.65');
  if (style.italic) parts.push('font-style:italic');
  if (style.underline) parts.push('text-decoration:underline');
  return parts.join(';');
}

function measure() {
  const host = el('screen');
  const probe = document.createElement('span');
  probe.textContent = 'M'.repeat(20);
  probe.style.cssText = 'position:absolute;visibility:hidden';
  host.append(probe);
  const width = probe.getBoundingClientRect().width / 20;
  probe.remove();
  return { width, height: parseFloat(getComputedStyle(host).lineHeight) };
}

// Fit the pane's own width to the viewport rather than resizing the pane: this
// is an observer, and a viewer that reshaped what it is watching would change
// the thing for everyone else looking at it.
function refit() {
  const host = el('screen');
  if (!screen || !host.clientWidth) return;
  host.style.fontSize = '13px';
  const reference = measure().width;
  const room = host.clientWidth - 2 * 0.7 * parseFloat(getComputedStyle(document.body).fontSize);
  const wanted = 13 * (room / screen.width) / reference;
  host.style.fontSize = `${Math.max(7, Math.min(15, wanted))}px`;
  cell = measure();
}

function paint() {
  const host = el('screen');
  host.innerHTML = '';
  if (!screen) return;
  for (const runs of screen.rows) {
    const line = document.createElement('div');
    line.className = 'line';
    for (const run of runs) {
      const span = document.createElement('span');
      // textContent, never innerHTML: this is output from someone's terminal.
      span.textContent = run.text;
      const css = runStyle(run.style);
      if (css) span.setAttribute('style', css);
      line.append(span);
    }
    host.append(line);
  }
  if (!cell) cell = measure();
  // Absent when the program asked for no cursor, and then none is drawn.
  if (screen.cursor) {
    const mark = document.createElement('div');
    mark.className = 'cursor';
    mark.style.width = `${cell.width}px`;
    mark.style.height = `${cell.height}px`;
    mark.style.left = `calc(.7rem + ${screen.cursor.column * cell.width}px)`;
    mark.style.top = `calc(.6rem + ${screen.cursor.row * cell.height}px)`;
    host.append(mark);
  }
}

// Sent only after the update is on the screen, because that is what it claims.
// The daemon holds a small number of updates for this viewer and sends no more
// until they are painted, so a phone on a slow link falls behind rather than
// filling the daemon with a pane's history — and what it is sent when it
// catches up is the screen as it stands, not the backlog it missed.
function acknowledge() {
  if (!watching || !screen) return;
  send({ type: 'pane.screen_ack', pane: watching, sequence: screen.sequence });
}

function observe(pane, label) {
  if (watching && !sameId(pane, watching)) send({ type: 'pane.unsubscribe', pane: watching });
  watching = pane;
  screen = null;
  cell = null;
  el('viewer').hidden = false;
  el('viewing').textContent = label || `${pane.target}/${pane.session}/${pane.resource}`;
  el('screen-note').textContent = 'waiting for output…';
  el('screen').innerHTML = '';
  subscribeScreen(pane);
}

// `screen` rather than `frames`: this page has no emulator and wants none.
// One definition, because three callers ask for the same thing — opening a
// pane, recovering from a gap, and recovering from a dropped connection.
function subscribeScreen(pane) {
  send({
    type: 'pane.subscribe',
    pane,
    access: 'observe',
    cols: 80,
    rows: 24,
    representation: 'screen',
  });
}

function stopWatching(why) {
  if (watching) send({ type: 'pane.unsubscribe', pane: watching });
  watching = null;
  screen = null;
  el('viewer').hidden = true;
  el('screen-note').textContent = text(why);
  renderPanes();
}

// A gap in the sequence means an update was missed. Resubscribing is the
// recovery, because it yields a whole screen.
function resync() {
  if (!watching) return;
  const pane = watching;
  el('screen-note').textContent = 'missed an update — resyncing';
  send({ type: 'pane.unsubscribe', pane });
  screen = null;
  subscribeScreen(pane);
}

function renderPanes() {
  const list = el('panes');
  const rows = [];
  for (const runtime of targets.values()) {
    const snapshot = runtime.snapshot;
    if (!snapshot) continue;
    for (const pane of snapshot.panes || []) {
      rows.push({ pane, snapshot });
    }
  }
  list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = '<li class="empty">no panes</li>';
    return;
  }
  for (const row of rows) {
    const id = row.pane.id;
    const item = document.createElement('li');
    item.className = 'tap';
    item.innerHTML = `<div class="row">
        <span class="name"></span>
        <span class="badge"></span>
        <span class="where"></span>
      </div>`;
    const label = row.pane.label || id.resource;
    item.querySelector('.name').textContent = label;
    const badge = item.querySelector('.badge');
    if (row.pane.agent_status) {
      badge.textContent = row.pane.agent_status;
      badge.classList.add(phase(row.pane.agent_status));
    } else {
      badge.remove();
    }
    item.querySelector('.where').textContent = qualify(id);
    if (sameId(id, watching)) item.classList.add('unread');
    item.addEventListener('click', () => observe(id, `${qualify(id)}/${label}`));
    list.append(item);
  }
}

function apply(message) {
  switch (message.type) {
    case 'server.hello':
      send({ type: 'state.subscribe' });
      // A reconnect is a new client to the daemon, which knows nothing about
      // what this page was watching — so what was being watched is asked for
      // again here. Without this the last screen stays painted and the link
      // says "live" while nothing arrives ever again, which is worse than a
      // viewer that visibly breaks.
      if (watching) {
        screen = null;
        cell = null;
        subscribeScreen(watching);
      }
      break;
    case 'state.full':
      targets.clear();
      for (const runtime of message.state.targets) {
        targets.set(`${runtime.key.target}/${runtime.key.session}`, runtime);
      }
      renderTargets();
      renderWaiting();
      renderPanes();
      break;
    case 'state.target': {
      const key = `${message.target.target}/${message.target.session}`;
      if (message.state) targets.set(key, message.state);
      else targets.delete(key);
      renderTargets();
      renderWaiting();
      renderPanes();
      break;
    }
    case 'pane.screen':
      if (!sameId(message.pane, watching)) break;
      screen = message.screen;
      el('screen-note').textContent = '';
      refit();
      paint();
      acknowledge();
      break;
    case 'pane.screen_diff': {
      if (!sameId(message.pane, watching)) break;
      const diff = message.diff;
      if (!screen || diff.follows !== screen.sequence) {
        resync();
        break;
      }
      for (const update of diff.rows) screen.rows[update.row] = update.runs;
      screen.cursor = diff.cursor;
      screen.sequence = diff.sequence;
      paint();
      acknowledge();
      break;
    }
    case 'pane.lease':
      if (sameId(message.pane, watching) && message.access !== 'observe') {
        el('screen-note').textContent = `holding ${message.access}`;
      }
      break;
    case 'pane.closed':
      if (sameId(message.pane, watching)) stopWatching('the pane closed');
      break;
    case 'attention.history':
      history = message.events;
      renderHistory();
      break;
    case 'attention.event':
      history = history.filter(held => held.id !== message.event.id).concat(message.event);
      renderHistory();
      break;
  }
}

function connect() {
  const stream = new EventSource(`/events?session=${session}`);
  stream.onopen = () => {
    el('link').textContent = 'live';
    el('link').className = 'live';
  };
  stream.onmessage = event => {
    try {
      apply(JSON.parse(event.data));
    } catch (_) {
      // A message this page does not understand is not a reason to stop
      // rendering the ones it does.
    }
  };
  // EventSource reconnects on its own, and the daemon treats each reconnect as
  // a new client: federation state and attention history are resent unasked.
  // Pane observation is not — a subscription belongs to the connection that
  // made it — so `server.hello` asks for it again. This comment used to say
  // nothing here had to remember where it was; that stopped being true the day
  // this page started watching panes.
  stream.onerror = () => {
    el('link').textContent = 'reconnecting…';
    el('link').className = 'down';
  };
}

el('mark').onclick = () => send({ type: 'attention.mark_all_seen' });
el('stop').onclick = () => stopWatching('');

// A rotation or a resize changes how much of the pane fits, not the pane.
window.addEventListener('resize', () => {
  if (!screen) return;
  refit();
  paint();
});

// A scanned pairing code arrives in the fragment, never in a query string. A
// fragment is not sent to the server, so the code stays out of request lines,
// out of any access log, and out of a reverse proxy that would otherwise see
// every pairing attempt in clear. It is stripped from the address before
// anything else runs, so a bookmark, a shared link or the back button cannot
// carry a live credential.
function codeFromFragment() {
  const raw = (location.hash || '').replace(/^#/, '');
  if (!raw) return '';
  history.replaceState(null, '', location.pathname + location.search);
  let decoded = '';
  try {
    decoded = decodeURIComponent(raw).trim();
  } catch (_) {
    return '';
  }
  // Bounded, not shaped. Anything can link to this page, so the fragment is
  // attacker-supplied and this value goes straight into a form field — a length
  // and character bound is what that needs.
  //
  // It deliberately does not encode what a code looks like. The daemon defines
  // that, in one place, and already accepts a code however it was typed:
  // `normalize_code` treats case and separators as presentation. A pattern here
  // would be a second definition with nothing holding the two together, and the
  // day they disagreed every scan would quietly degrade to typing with no error
  // anywhere and a person debugging it from a phone. Whether a code is right is
  // the daemon's to answer, and it answers in constant time.
  return /^[A-Za-z0-9-]{1,32}$/.test(decoded) ? decoded.toUpperCase() : '';
}

// A guess the person can correct, so a device that pairs by scanning still ends
// up with a name worth seeing in `device list` rather than an empty one.
function suggestedName() {
  const agent = navigator.userAgent || '';
  if (/iPad|Tablet/i.test(agent)) return 'iPad';
  if (/Android|iPhone|Mobile/i.test(agent)) return 'phone';
  return 'browser';
}

// The version of the daemon, not of this page: the page ships inside that
// binary, so a stale daemon is otherwise invisible from here.
async function start() {
  // Read first, and unconditionally, so the address is cleaned even when the
  // device turns out to be paired already.
  const scanned = codeFromFragment();
  let session_state = { paired: true, version: '' };
  try {
    session_state = await (await fetch('/session')).json();
  } catch (_) {
    // If this cannot be reached, the stream will not connect either, and the
    // link indicator is the honest place to show that.
  }
  el('version').textContent = session_state.version ? `daemon ${session_state.version}` : '';
  if (!session_state.paired) {
    el('pairing').hidden = false;
    if (scanned) {
      // The code is the part worth not retyping on a phone. The name is left
      // for a person, because a device nobody named is one nobody can revoke
      // with any confidence later.
      el('code').value = scanned;
      el('name').value = el('name').value || suggestedName();
      el('name').focus();
      el('name').select();
    }
    return;
  }
  document.querySelector('main').hidden = false;
  connect();
}

el('pair').onclick = async () => {
  el('pair-error').textContent = '';
  const response = await fetch('/pair', {
    method: 'POST',
    body: JSON.stringify({ code: el('code').value, name: el('name').value }),
  });
  if (response.ok) {
    // The token arrived as a cookie the page cannot read, so there is nothing
    // to store here; reloading picks it up.
    location.reload();
    return;
  }
  el('pair-error').textContent = await response.text();
};

start();
</script>
