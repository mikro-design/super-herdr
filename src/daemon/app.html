<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<title>Super-Herdr</title>
<style>
  :root {
    --bg: #11131a; --panel: #171a23; --line: #262b38;
    --text: #e6e9f0; --dim: #8b93a7; --accent: #6ea8fe;
    --wait: #ffb454; --work: #6ee7a8; --gone: #6b7280;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fa; --panel: #fff; --line: #dfe3ec;
      --text: #12151c; --dim: #5b6376; --accent: #2563eb;
      --wait: #b45309; --work: #047857; --gone: #6b7280;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 ui-sans-serif, -apple-system, system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; gap: .6rem;
    align-items: baseline; padding: .85rem 1rem; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 620; letter-spacing: .01em; }
  #link { margin-left: auto; font-size: .78rem; color: var(--dim); }
  #link.live { color: var(--work); }
  #link.down { color: var(--wait); }
  main { padding: 1rem; max-width: 46rem; margin: 0 auto; }
  h2 {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 1.6rem 0 .6rem; font-weight: 600;
  }
  h2:first-child { margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: .7rem; margin-bottom: .45rem; padding: .7rem .85rem;
  }
  li.tap { cursor: pointer; }
  li.tap:active { border-color: var(--accent); }
  .row { display: flex; gap: .5rem; align-items: baseline; }
  .name { font-weight: 560; }
  .where { color: var(--dim); font-size: .82rem; margin-left: auto; text-align: right; }
  .note { color: var(--dim); font-size: .82rem; }
  .badge {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
    padding: .13rem .42rem; border-radius: .35rem; border: 1px solid currentColor;
  }
  .wait { color: var(--wait); } .work { color: var(--work); } .gone { color: var(--gone); }
  .unread { box-shadow: inset 3px 0 0 var(--wait); }
  .empty { color: var(--dim); padding: .6rem .1rem; }
  #attention-panel {
    margin-top: 1.25rem; background: var(--panel); border: 1px solid var(--line);
    border-radius: .7rem; overflow: hidden;
  }
  #attention-panel > summary {
    display: flex; align-items: center; gap: .6rem; padding: .75rem .85rem;
    cursor: pointer; font-weight: 560;
  }
  #attention-count { margin-left: auto; }
  #attention { padding: 0 .7rem .25rem; }
  #attention li { background: var(--bg); padding: .55rem .65rem; }
  #attention-panel .actions { padding: 0 .7rem .7rem; }
  #panes { display: grid; gap: .8rem; }
  #panes .target-card { margin: 0; padding: 0; overflow: hidden; }
  .target-group > summary { cursor: pointer; list-style-position: inside; }
  .target-title { display: inline-flex; width: calc(100% - 1.4rem); align-items: baseline; gap: .6rem; padding: .75rem .85rem; }
  .target-group[open] > summary { border-bottom: 1px solid var(--line); }
  .target-title .note { margin-left: auto; }
  .session-group { border-bottom: 1px solid var(--line); }
  .session-group:last-child { border-bottom: 0; }
  .session-group > summary { cursor: pointer; padding: .65rem .85rem; color: var(--accent); }
  .session-summary { display: inline-flex; width: calc(100% - 1.2rem); gap: .5rem; align-items: baseline; }
  .session-summary .badge { margin-left: auto; }
  .workspace-group { padding: .35rem .75rem .7rem 1.2rem; }
  .workspace-title { display: flex; gap: .5rem; color: var(--dim); font-size: .78rem; margin: .35rem 0; }
  .workspace-title .where { margin-left: auto; }
  .pane-list li { margin-bottom: .35rem; padding: .55rem .65rem; background: var(--bg); }
  .pane-list li:last-child { margin-bottom: 0; }
  button {
    font: inherit; color: var(--accent); background: none;
    border: 1px solid var(--line); border-radius: .55rem;
    padding: .35rem .7rem; cursor: pointer;
  }
  .actions { display: flex; gap: .5rem; margin-top: .7rem; }
  #line {
    flex: 1; min-width: 0; padding: .5rem .6rem; font: inherit;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: .4rem;
  }
  .keys { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  .keys button { min-width: 3.4rem; }
  #version { font-size: .72rem; color: var(--dim); }
  #pairing { padding: 1rem; max-width: 26rem; margin: 0 auto; }
  #pairing label { display: block; margin: .8rem 0; color: var(--dim); font-size: .82rem; }
  #pairing .field-input {
    display: block; width: 100%; margin-top: .3rem; padding: .6rem .7rem;
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: .55rem;
  }
  .code-boxes { display: flex; gap: .35rem; margin-top: .35rem; }
  #pairing .code-box {
    width: min(2.6rem, calc((100vw - 6.5rem) / 8)); height: 3rem; box-sizing: border-box; padding: 0;
    color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: .5rem; text-align: center; text-transform: uppercase;
    font: 700 1.25rem ui-monospace, monospace;
  }
  #pairing .code-box:nth-child(5) { margin-left: .45rem; }
  #pairing .code-box:focus { border-color: var(--accent); outline: 2px solid #60a5fa55; }
  #pair-error { color: var(--wait); min-height: 1.2em; }
  #pair-confirmation { padding: .7rem; border: 1px solid var(--line); border-radius: .55rem; }
  #pair-confirmation strong { display: block; color: var(--text); font: 700 1.4rem ui-monospace, monospace; letter-spacing: .16em; }
  /* The screen keeps a terminal's own dark ground in either colour scheme: a
     program chose its colours against black, and re-grounding them on white
     would misreport what the pane looks like. */
  .screen {
    position: relative; overflow: auto; background: #0b0d12; color: #d6dae4;
    border: 1px solid var(--line); border-radius: .7rem; padding: .6rem .7rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.3; white-space: pre; font-size: 14px;
    overscroll-behavior: contain; touch-action: pan-x pan-y; user-select: text;
    -webkit-overflow-scrolling: touch;
  }
  .screen .line { min-height: 1.25em; }
  .screen .cursor {
    position: absolute; background: var(--accent); opacity: .6; pointer-events: none;
  }
  #viewing { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; }
  #screen-note { color: var(--dim); font-size: .78rem; white-space: nowrap; }
  #viewer {
    position: fixed; top: 0; right: 0; bottom: auto; left: 0; z-index: 5;
    height: 100dvh; overflow: hidden;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: .65rem;
    padding: calc(.7rem + env(safe-area-inset-top))
             calc(.7rem + env(safe-area-inset-right))
             calc(.7rem + env(safe-area-inset-bottom))
             calc(.7rem + env(safe-area-inset-left));
    background: var(--bg);
  }
  #viewer[hidden] { display: none; }
  #viewer > * { width: 100%; max-width: 70rem; margin-left: auto; margin-right: auto; }
  .viewer-head { display: flex; align-items: center; gap: .6rem; min-width: 0; }
  .viewer-head #stop { margin-left: auto; flex: none; }
  .viewer-controls { min-width: 0; }
  .viewer-controls > .actions { margin: 0; align-items: center; }
  #keyboard { padding-top: .2rem; }

  @media (max-width: 640px) {
    header { padding: .65rem .75rem; }
    main { padding: .7rem; }
    h2 { margin-top: 1.1rem; }
    #panes { gap: .55rem; }
    .workspace-group { padding-left: .75rem; padding-right: .55rem; }
    #viewer { gap: .45rem; padding: calc(.4rem + env(safe-area-inset-top)) calc(.4rem + env(safe-area-inset-right)) calc(.4rem + env(safe-area-inset-bottom)) calc(.4rem + env(safe-area-inset-left)); }
    .viewer-head { min-height: 2.5rem; }
    #screen-note { display: none; }
    #viewer .screen { border-radius: .45rem; padding: .45rem .5rem; }
    .viewer-controls { background: var(--panel); border: 1px solid var(--line); border-radius: .55rem; padding: .45rem; }
    #control { width: 100%; min-height: 2.75rem; font-weight: 650; }
    #line { min-height: 2.75rem; font-size: 16px; }
    #send { min-height: 2.75rem; }
    .keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .35rem; }
    .keys button { min-width: 0; min-height: 2.65rem; padding: .3rem; }
  }
</style>

<header>
  <h1>Super-Herdr</h1>
  <span id="version"></span>
  <span id="link">connecting…</span>
</header>
<section id="pairing" hidden>
  <h2>Pair this device</h2>
  <p class="note">
    Ask the terminal client for a pairing code, then enter it here. The code is
    good once and expires in a few minutes.
  </p>
  <span id="code-label" class="note">Code</span>
  <div id="code" class="code-boxes" role="group" aria-labelledby="code-label">
    <input class="code-box" aria-label="Code character 1" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="1" required>
    <input class="code-box" aria-label="Code character 2" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
    <input class="code-box" aria-label="Code character 3" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
    <input class="code-box" aria-label="Code character 4" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
    <input class="code-box" aria-label="Code character 5" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
    <input class="code-box" aria-label="Code character 6" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
    <input class="code-box" aria-label="Code character 7" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
    <input class="code-box" aria-label="Code character 8" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
  </div>
  <label>Name this device <input id="name" class="field-input" autocomplete="off"
    placeholder="phone"></label>
  <div class="actions"><button id="pair">Pair</button></div>
  <p class="note" id="pair-confirmation" hidden>
    Compare this number with Super-Herdr before approving:
    <strong id="pair-confirmation-value"></strong>
  </p>
  <p class="note" id="pair-error"></p>
</section>
<main hidden>
  <h2>Terminals</h2>
  <ul id="panes"><li class="empty">no panes</li></ul>

  <details id="attention-panel">
    <summary>Attention <span id="attention-count" class="badge gone">none</span></summary>
    <ul id="attention"><li class="empty">nothing needs attention</li></ul>
    <div class="actions"><button id="mark">Mark all read</button></div>
  </details>

  <section id="viewer" hidden>
    <div class="viewer-head">
      <strong id="viewing"></strong>
      <span class="note" id="screen-note"></span>
      <button id="stop">Done</button>
    </div>
    <div id="screen" class="screen"></div>
    <div class="viewer-controls">
      <div class="actions"><button id="control">Take control &amp; type</button></div>
      <div id="keyboard" hidden>
        <form id="line-form" class="actions">
          <input id="line" placeholder="Type a command" autocapitalize="off"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 enterkeyhint="send">
          <button id="send" type="submit">Send</button>
        </form>
        <div class="keys">
          <button data-key="enter">Enter</button>
          <button data-key="escape">Esc</button>
          <button data-key="tab">Tab</button>
          <button data-key="up">&uarr;</button>
          <button data-key="down">&darr;</button>
          <button data-key="left">&larr;</button>
          <button data-key="right">&rarr;</button>
          <button data-key="backspace">Back</button>
          <button data-key="interrupt">Ctrl-C</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
// One session joins the event stream to the commands that steer it. The daemon
// keys its attachment on this, so a second tab is a second client rather than
const session = (crypto.randomUUID && crypto.randomUUID() || String(Math.random()).slice(2))
  .replace(/[^a-zA-Z0-9-]/g, '');

// A hosted bridge gives each daemon a path. Direct listeners still live at the
// origin root, so one prefix function keeps every request on whichever route
// served this page without teaching the daemon about public rendezvous IDs.
const bridged = location.pathname.match(/^\/r\/[0-9a-fA-F]{32}(?:\/|$)/);
const basePath = bridged ? bridged[0].replace(/\/$/, '') : '';
const endpoint = path => `${basePath}${path}`;

// The daemon's own vocabulary, mirrored here. Nothing is derived locally: the
// federation and the attention history are what the daemon last said they were.
const targets = new Map();
let attention = [];
const openTargets = new Set();
const openSessions = new Set();

const el = id => document.getElementById(id);
const text = value => String(value == null ? '' : value);
const codeBoxes = [...document.querySelectorAll('.code-box')];
const codeCharacters = value => String(value || '')
  .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, codeBoxes.length);
const enteredCode = () => codeBoxes.map(box => box.value).join('');

function fillCode(value) {
  const characters = codeCharacters(value);
  codeBoxes.forEach((box, index) => { box.value = characters[index] || ''; });
  codeBoxes[Math.min(characters.length, codeBoxes.length - 1)].focus();
}

for (const [index, box] of codeBoxes.entries()) {
  box.oninput = () => {
    const characters = codeCharacters(box.value);
    box.value = characters[0] || '';
    if (characters.length > 1) {
      const combined = codeBoxes.slice(0, index).map(one => one.value).join('') + characters;
      fillCode(combined);
    } else if (characters.length === 1 && index + 1 < codeBoxes.length) {
      codeBoxes[index + 1].focus();
    }
  };
  box.onkeydown = event => {
    if (event.key === 'Backspace' && !box.value && index > 0) {
      codeBoxes[index - 1].value = '';
      codeBoxes[index - 1].focus();
      event.preventDefault();
    } else if (event.key === 'ArrowLeft' && index > 0) {
      codeBoxes[index - 1].focus();
      event.preventDefault();
    } else if (event.key === 'ArrowRight' && index + 1 < codeBoxes.length) {
      codeBoxes[index + 1].focus();
      event.preventDefault();
    }
  };
}
el('code').onpaste = event => {
  const pasted = event.clipboardData && event.clipboardData.getData('text');
  if (pasted) {
    event.preventDefault();
    fillCode(pasted);
  }
};

function send(message) {
  return fetch(endpoint(`/command?session=${session}`), {
    method: 'POST',
    body: JSON.stringify(message),
  });
}

function qualify(pane) {
  return `${pane.target}/${pane.session}`;
}

function phase(status) {
  const value = text(status).toLowerCase();
  if (['blocked', 'waiting', 'waiting_for_input', 'needs_input', 'ready'].includes(value)) return 'wait';
  if (['working', 'running', 'busy', 'active'].includes(value)) return 'work';
  return 'gone';
}

function renderAttention() {
  const rows = [];
  const represented = new Set();
  for (const runtime of targets.values()) {
    const snapshot = runtime.snapshot;
    if (!snapshot || runtime.connection !== 'live') continue;
    for (const agent of snapshot.agents || []) {
      const status = agent.status || '';
      if ((phase(status) !== 'wait' && !agent.interactive_ready) || !agent.pane) continue;
      const name = agent.name || agent.agent || 'agent';
      const key = `${agent.pane.target}/${agent.pane.session}/${agent.pane.resource}/${name}`;
      represented.add(key);
      rows.push({
        key,
        pane: agent.pane,
        name,
        status: status || 'waiting',
        detail: qualify(agent.pane),
        unread: true,
      });
    }
  }
  for (const event of attention.slice().reverse()) {
    if (!event.unread || !event.pane) continue;
    const name = event.agent || 'agent';
    const key = `${event.pane.target}/${event.pane.session}/${event.pane.resource}/${name}`;
    if (represented.has(key)) continue;
    represented.add(key);
    rows.push({
      key,
      pane: event.pane,
      name,
      status: text(event.kind).replace(/_/g, ' '),
      detail: `${qualify(event.pane)} · ${text(event.workspace)}`,
      unread: true,
    });
    if (rows.length >= 12) break;
  }

  const list = el('attention');
  list.innerHTML = '';
  const count = el('attention-count');
  count.textContent = rows.length ? String(rows.length) : 'none';
  count.className = `badge ${rows.length ? 'wait' : 'gone'}`;
  if (!rows.length) {
    list.innerHTML = '<li class="empty">nothing needs attention</li>';
    return;
  }
  for (const row of rows.slice(0, 12)) {
    const item = document.createElement('li');
    item.className = 'tap unread';
    item.innerHTML = `<div class="row">
        <span class="name"></span>
        <span class="badge"></span>
        <span class="where"></span>
      </div>`;
    item.querySelector('.name').textContent = row.name;
    const badge = item.querySelector('.badge');
    badge.textContent = row.status;
    badge.classList.add(phase(row.status));
    item.querySelector('.where').textContent = row.detail;
    item.onclick = () => {
      send({ type: 'attention.mark_seen', pane: row.pane });
      observe(row.pane, `${row.detail}/${row.name}`);
    };
    list.append(item);
  }
}

// The pane being watched, and the screen the daemon last described. Nothing is
// derived locally: a diff that does not follow the update we hold is refused
// rather than guessed at, because a grid painted from a missed update stays
// wrong forever and says nothing about it.
let watching = null;
// The access this page holds on what it is watching. Observing is the default
// and the safe one: a viewer that could type without being asked to would be a
// phone in a pocket sending keystrokes to somebody's shell.
let lease = 'observe';
// A phone permits its soft keyboard to open only while handling the tap itself.
// The lease answer arrives later on the event stream, so remember that narrow
// interval separately from the access the daemon has actually granted.
let requestingControl = false;
let screen = null;
let cell = null;

function sameId(left, right) {
  return left && right
    && left.target === right.target
    && left.session === right.session
    && left.resource === right.resource;
}

// This page's own default pair, kept in step with `.screen` in the stylesheet.
// Inverse over defaults is resolved against these.
const SCREEN_BG = '#0b0d12';
const SCREEN_FG = '#d6dae4';

// The sixteen the terminal names, as most terminals draw them.
const BASE = [
  '#000000', '#cd3131', '#0dbc79', '#e5e510', '#2472c8', '#bc3fbc', '#11a8cd', '#e5e5e5',
  '#666666', '#f14c4c', '#23d18b', '#f5f543', '#3b8eea', '#d670d6', '#29b8db', '#ffffff',
];

// Indexed colours arrive indexed rather than resolved, because the palette
// belongs to whoever displays them. This is that decision, made here.
function colour(value) {
  if (!value || value.kind === 'default') return null;
  if (value.kind === 'rgb') return `rgb(${value.red} ${value.green} ${value.blue})`;
  const index = value.index;
  if (index < 16) return BASE[index];
  if (index < 232) {
    const level = step => (step === 0 ? 0 : 55 + step * 40);
    const offset = index - 16;
    return `rgb(${level(Math.floor(offset / 36))} `
      + `${level(Math.floor(offset / 6) % 6)} ${level(offset % 6)})`;
  }
  const grey = 8 + (index - 232) * 10;
  return `rgb(${grey} ${grey} ${grey})`;
}

function runStyle(style) {
  if (!style) return '';
  const parts = [];
  let fg = colour(style.foreground);
  let bg = colour(style.background);
  // Inverse that a colour swap could not express: both sides were the
  // terminal's defaults, so the daemon sent the flag instead of two colours
  // that would have cancelled out. Exchanging our own defaults needs no palette
  // knowledge, which is exactly why it was left to us.
  if (style.inverse) {
    fg = bg || SCREEN_BG;
    bg = SCREEN_FG;
  }
  if (fg) parts.push(`color:${fg}`);
  if (bg) parts.push(`background:${bg}`);
  if (style.bold) parts.push('font-weight:700');
  if (style.dim) parts.push('opacity:.65');
  if (style.italic) parts.push('font-style:italic');
  if (style.underline) parts.push('text-decoration:underline');
  return parts.join(';');
}

function measure() {
  const host = el('screen');
  const probe = document.createElement('span');
  probe.textContent = 'M'.repeat(20);
  probe.style.cssText = 'position:absolute;visibility:hidden';
  host.append(probe);
  const width = probe.getBoundingClientRect().width / 20;
  probe.remove();
  return { width, height: parseFloat(getComputedStyle(host).lineHeight) };
}

// Fit the pane's own width to the viewport rather than resizing the pane: this
// is an observer, and a viewer that reshaped what it is watching would change
// the thing for everyone else looking at it.
function refit() {
  const host = el('screen');
  if (!screen || !host.clientWidth) return;
  host.style.fontSize = '14px';
  const reference = measure().width;
  const room = host.clientWidth - 2 * 0.7 * parseFloat(getComputedStyle(document.body).fontSize);
  const wanted = 14 * (room / screen.width) / reference;
  // Below twelve pixels an 80-column pane technically fits but is not
  // readable on a phone. Preserve legibility and let the terminal pan instead.
  host.style.fontSize = `${Math.max(12, Math.min(16, wanted))}px`;
  cell = measure();
}

function paint() {
  const host = el('screen');
  host.innerHTML = '';
  if (!screen) return;
  if (!cell) cell = measure();
  const contentWidth = Math.max(1, screen.width) * cell.width;
  for (const runs of screen.rows) {
    const line = document.createElement('div');
    line.className = 'line';
    line.style.minWidth = `${contentWidth}px`;
    for (const run of runs) {
      const span = document.createElement('span');
      // textContent, never innerHTML: this is output from someone's terminal.
      span.textContent = run.text;
      const css = runStyle(run.style);
      if (css) span.setAttribute('style', css);
      line.append(span);
    }
    host.append(line);
  }
  // Absent when the program asked for no cursor, and then none is drawn.
  if (screen.cursor) {
    const mark = document.createElement('div');
    mark.className = 'cursor';
    mark.style.width = `${cell.width}px`;
    mark.style.height = `${cell.height}px`;
    mark.style.left = `calc(.7rem + ${screen.cursor.column * cell.width}px)`;
    mark.style.top = `calc(.6rem + ${screen.cursor.row * cell.height}px)`;
    host.append(mark);
    if (lease === 'control') {
      const left = screen.cursor.column * cell.width;
      const top = screen.cursor.row * cell.height;
      const visibleRight = (host.scrollLeft || 0) + host.clientWidth - cell.width;
      const visibleBottom = (host.scrollTop || 0) + (host.clientHeight || 0) - cell.height;
      if (left < (host.scrollLeft || 0)) host.scrollLeft = Math.max(0, left - cell.width);
      else if (left > visibleRight) host.scrollLeft = left - host.clientWidth + 2 * cell.width;
      if (host.clientHeight && top < (host.scrollTop || 0)) host.scrollTop = Math.max(0, top - cell.height);
      else if (host.clientHeight && top > visibleBottom) {
        host.scrollTop = top - host.clientHeight + 2 * cell.height;
      }
    }
  }
}

// Sent only after the update is on the screen, because that is what it claims.
// The daemon holds a small number of updates for this viewer and sends no more
// until they are painted, so a phone on a slow link falls behind rather than
// filling the daemon with a pane's history — and what it is sent when it
// catches up is the screen as it stands, not the backlog it missed.
function acknowledge() {
  if (!watching || !screen) return;
  send({ type: 'pane.screen_ack', pane: watching, sequence: screen.sequence });
}

function observe(pane, label) {
  if (watching && !sameId(pane, watching)) send({ type: 'pane.unsubscribe', pane: watching });
  watching = pane;
  screen = null;
  cell = null;
  // A lease belongs to a pane, not to this page: watching something else means
  // holding nothing until the daemon says otherwise.
  lease = 'observe';
  requestingControl = false;
  renderKeyboard();
  el('viewer').hidden = false;
  el('viewing').textContent = label || `${pane.target}/${pane.session}/${pane.resource}`;
  el('screen-note').textContent = 'waiting for output…';
  el('screen').innerHTML = '';
  subscribeScreen(pane);
}

// `screen` rather than `frames`: this page has no emulator and wants none.
// One definition, because three callers ask for the same thing — opening a
// pane, recovering from a gap, and recovering from a dropped connection.
function subscribeScreen(pane) {
  send({
    type: 'pane.subscribe',
    pane,
    access: 'observe',
    cols: 80,
    rows: 24,
    representation: 'screen',
  });
}

// Control is asked for rather than assumed. The daemon hands the lease over
// and tells whoever held it, so this never takes one silently.
function takeControl() {
  if (!watching) return;
  requestingControl = true;
  renderKeyboard();
  // This runs synchronously inside the button tap. Waiting for `pane.lease`
  // loses mobile browsers' user activation and leaves the input visible but
  // the phone keyboard closed.
  el('line').focus();
  send({ type: 'pane.take_control', pane: watching });
  el('screen-note').textContent = 'asking for control…';
}

// `interactive-widget=resizes-content` handles the soft keyboard in browsers
// that implement it. Safari exposes the same usable rectangle through
// VisualViewport, so size and place the fixed viewer there as a fallback.
function fitViewerViewport() {
  const viewport = window.visualViewport;
  if (!viewport) return;
  const viewer = el('viewer');
  viewer.style.height = `${viewport.height}px`;
  viewer.style.top = `${viewport.offsetTop}px`;
}

// One place that turns text into bytes, because a pane is a terminal and a
// terminal takes bytes: what is typed on a phone is UTF-8, and the protocol
// carries it base64 so that a byte a JSON string cannot hold still arrives.
function sendBytes(bytes) {
  if (!watching || lease !== 'control') return;
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  send({ type: 'pane.input', pane: watching, bytes: btoa(binary) });
}

function sendText(text) {
  sendBytes(new TextEncoder().encode(text));
}

// What the buttons send. Named rather than numbered so the markup says what it
// means, and kept here rather than in the markup so a key is one definition.
const KEYS = {
  enter: '\r',
  tab: '\t',
  escape: '\x1b',
  interrupt: '\x03',
  up: '\x1b[A',
  down: '\x1b[B',
  left: '\x1b[D',
  right: '\x1b[C',
  backspace: '\x7f',
};

// Reveal the input during the tap that requests control, but enable every send
// action only after the daemon grants the lease. This opens a phone keyboard
// without turning an optimistic UI transition into authorization.
function renderKeyboard() {
  const holding = Boolean(watching) && lease === 'control';
  el('keyboard').hidden = !holding && !requestingControl;
  el('control').hidden = holding || requestingControl || !watching;
  el('send').disabled = !holding;
  for (const button of document.querySelectorAll('.keys button')) {
    button.disabled = !holding;
  }
}

function stopWatching(why) {
  if (watching) send({ type: 'pane.unsubscribe', pane: watching });
  watching = null;
  lease = 'observe';
  requestingControl = false;
  renderKeyboard();
  screen = null;
  cell = null;
  el('screen').innerHTML = '';
  const reason = text(why);
  // The reason lives inside the viewer, so hiding the viewer would write an
  // explanation into something nobody can read — a pane that closed under
  // somebody would simply vanish. Only a person choosing to stop takes the
  // panel away; a viewer that stopped on its own stays up to say why.
  el('viewer').hidden = !reason;
  el('screen-note').textContent = reason;
  renderPanes();
}

// A gap in the sequence means an update was missed. Resubscribing is the
// recovery, because it yields a whole screen.
function resync() {
  if (!watching) return;
  const pane = watching;
  el('screen-note').textContent = 'missed an update — resyncing';
  send({ type: 'pane.unsubscribe', pane });
  screen = null;
  subscribeScreen(pane);
}

function renderPanes() {
  const list = el('panes');
  list.innerHTML = '';
  if (!targets.size) {
    list.innerHTML = '<li class="empty">no targets</li>';
    return;
  }

  const grouped = new Map();
  for (const runtime of targets.values()) {
    const target = text(runtime.key && runtime.key.target) || 'unknown target';
    if (!grouped.has(target)) grouped.set(target, []);
    grouped.get(target).push(runtime);
  }

  for (const [target, runtimes] of [...grouped.entries()].sort()) {
    const targetCard = document.createElement('li');
    targetCard.className = 'target-card';
    const targetDetails = document.createElement('details');
    targetDetails.className = 'target-group';
    const targetSummary = document.createElement('summary');
    const targetTitle = document.createElement('div');
    targetTitle.className = 'target-title';
    const targetName = document.createElement('span');
    targetName.className = 'name';
    targetName.textContent = target;
    const targetCount = document.createElement('span');
    targetCount.className = 'note';
    targetCount.textContent = `${runtimes.length} session${runtimes.length === 1 ? '' : 's'}`;
    targetTitle.append(targetName, targetCount);
    targetSummary.append(targetTitle);
    targetDetails.append(targetSummary);
    const watchesTarget = Boolean(watching && watching.target === target);
    targetDetails.open = openTargets.has(target) || grouped.size === 1 || watchesTarget;
    targetDetails.ontoggle = () => {
      if (targetDetails.open) openTargets.add(target);
      else openTargets.delete(target);
    };

    runtimes.sort((left, right) =>
      text(left.key && left.key.session).localeCompare(text(right.key && right.key.session)));
    for (const runtime of runtimes) {
      const session = text(runtime.key && runtime.key.session) || 'default';
      const sessionKey = `${target}/${session}`;
      const details = document.createElement('details');
      details.className = 'session-group';
      const watchesSession = Boolean(
        watching && watching.target === target && watching.session === session,
      );
      details.open = openSessions.has(sessionKey) || runtimes.length === 1 || watchesSession;
      details.ontoggle = () => {
        if (details.open) openSessions.add(sessionKey);
        else openSessions.delete(sessionKey);
      };
      const summary = document.createElement('summary');
      const summaryRow = document.createElement('span');
      summaryRow.className = 'session-summary';
      const sessionName = document.createElement('span');
      sessionName.className = 'name';
      sessionName.textContent = session;
      const connection = document.createElement('span');
      connection.className = 'badge';
      const live = runtime.connection === 'live';
      connection.textContent = typeof runtime.connection === 'string'
        ? runtime.connection
        : Object.keys(runtime.connection || {})[0] || 'unknown';
      connection.classList.add(live ? 'work' : 'wait');
      summaryRow.append(sessionName, connection);
      summary.append(summaryRow);
      details.append(summary);

      const snapshot = runtime.snapshot;
      if (!snapshot) {
        const unavailable = document.createElement('p');
        unavailable.className = 'workspace-group note';
        unavailable.textContent = text(runtime.last_error) || 'no snapshot yet';
        details.append(unavailable);
        targetDetails.append(details);
        continue;
      }

      const workspaceStates = new Map(
        (snapshot.workspaces || []).map(workspace => [workspace.id.resource, workspace]));
      const workspaces = new Map();
      for (const pane of snapshot.panes || []) {
        const workspace = pane.workspace && pane.workspace.resource || 'other';
        if (!workspaces.has(workspace)) workspaces.set(workspace, []);
        workspaces.get(workspace).push(pane);
      }
      if (!workspaces.size) {
        const empty = document.createElement('p');
        empty.className = 'workspace-group note';
        empty.textContent = 'no panes';
        details.append(empty);
      }
      for (const [workspaceId, panes] of [...workspaces.entries()].sort()) {
        const workspace = workspaceStates.get(workspaceId);
        const workspaceGroup = document.createElement('section');
        workspaceGroup.className = 'workspace-group';
        const workspaceTitle = document.createElement('div');
        workspaceTitle.className = 'workspace-title';
        const workspaceName = document.createElement('span');
        workspaceName.className = 'name';
        workspaceName.textContent = workspace && workspace.label || workspaceId;
        const workspaceCount = document.createElement('span');
        workspaceCount.className = 'where';
        workspaceCount.textContent = `${panes.length} pane${panes.length === 1 ? '' : 's'}`;
        workspaceTitle.append(workspaceName, workspaceCount);
        workspaceGroup.append(workspaceTitle);

        const paneList = document.createElement('ul');
        paneList.className = 'pane-list';
        panes.sort((left, right) => text(left.id.resource).localeCompare(text(right.id.resource)));
        for (const pane of panes) {
          const id = pane.id;
          const item = document.createElement('li');
          item.className = 'tap';
          const row = document.createElement('div');
          row.className = 'row';
          const paneName = document.createElement('span');
          paneName.className = 'name';
          const label = pane.label || id.resource;
          paneName.textContent = label;
          row.append(paneName);
          if (pane.agent_status) {
            const badge = document.createElement('span');
            badge.className = `badge ${phase(pane.agent_status)}`;
            badge.textContent = pane.agent_status;
            row.append(badge);
          }
          const where = document.createElement('span');
          where.className = 'where';
          where.textContent = pane.tab && pane.tab.resource || 'terminal';
          row.append(where);
          item.append(row);
          if (sameId(id, watching)) item.classList.add('unread');
          item.addEventListener(
            'click',
            () => observe(id, `${target}/${session}/${workspaceName.textContent}/${label}`),
          );
          paneList.append(item);
        }
        workspaceGroup.append(paneList);
        details.append(workspaceGroup);
      }
      targetDetails.append(details);
    }
    targetCard.append(targetDetails);
    list.append(targetCard);
  }
}

function apply(message) {
  switch (message.type) {
    case 'server.hello':
      send({ type: 'state.subscribe' });
      // A reconnect is a new client to the daemon, which knows nothing about
      // what this page was watching — so what was being watched is asked for
      // again here. Without this the last screen stays painted and the link
      // says "live" while nothing arrives ever again, which is worse than a
      // viewer that visibly breaks.
      if (watching) {
        screen = null;
        cell = null;
        subscribeScreen(watching);
      }
      break;
    case 'state.full':
      targets.clear();
      for (const runtime of message.state.targets) {
        targets.set(`${runtime.key.target}/${runtime.key.session}`, runtime);
      }
      renderAttention();
      renderPanes();
      break;
    case 'state.target': {
      const key = `${message.target.target}/${message.target.session}`;
      if (message.state) targets.set(key, message.state);
      else targets.delete(key);
      renderAttention();
      renderPanes();
      break;
    }
    case 'pane.screen':
      if (!sameId(message.pane, watching)) break;
      screen = message.screen;
      el('screen-note').textContent = '';
      refit();
      paint();
      acknowledge();
      break;
    case 'pane.screen_diff': {
      if (!sameId(message.pane, watching)) break;
      const diff = message.diff;
      if (!screen || diff.follows !== screen.sequence) {
        resync();
        break;
      }
      for (const update of diff.rows) screen.rows[update.row] = update.runs;
      screen.cursor = diff.cursor;
      screen.sequence = diff.sequence;
      paint();
      acknowledge();
      break;
    }
    case 'pane.lease':
      if (sameId(message.pane, watching)) {
        lease = message.access;
        requestingControl = false;
        // A control lease that is refused or lost arrives as a downgrade to
        // observe rather than as an error, so this is also how the keyboard
        // goes away when somebody else takes the pane.
        el('screen-note').textContent =
          lease === 'control' ? 'holding control' : 'watching';
        renderKeyboard();
      }
      break;
    case 'pane.closed':
      if (sameId(message.pane, watching)) stopWatching('the pane closed');
      break;
    case 'attention.history':
      attention = message.events;
      renderAttention();
      break;
    case 'attention.event':
      attention = attention
        .filter(held => held.id !== message.event.id)
        .concat(message.event);
      renderAttention();
      break;
  }
}

function connect() {
  const stream = new EventSource(endpoint(`/events?session=${session}`));
  stream.onopen = () => {
    el('link').textContent = 'live';
    el('link').className = 'live';
  };
  stream.onmessage = event => {
    try {
      apply(JSON.parse(event.data));
    } catch (_) {
      // A message this page does not understand is not a reason to stop
      // rendering the ones it does.
    }
  };
  // EventSource reconnects on its own, and the daemon treats each reconnect as
  // a new client: federation state and attention history are resent unasked.
  // Pane observation is not — a subscription belongs to the connection that
  // made it — so `server.hello` asks for it again. This comment used to say
  // nothing here had to remember where it was; that stopped being true the day
  // this page started watching panes.
  stream.onerror = () => {
    el('link').textContent = 'reconnecting…';
    el('link').className = 'down';
  };
}

el('mark').onclick = () => send({ type: 'attention.mark_all_seen' });
el('control').onclick = takeControl;
el('line-form').onsubmit = event => {
  event.preventDefault();
  if (lease !== 'control') return;
  const line = el('line').value;
  // Enter is what a shell is waiting for, so a sent line carries it. An empty
  // line is still a line — it is how somebody asks for a fresh prompt.
  sendText(`${line}\r`);
  el('line').value = '';
  el('line').focus();
};
for (const button of document.querySelectorAll('.keys button')) {
  button.onpointerdown = event => event.preventDefault();
  button.onclick = () => {
    sendText(KEYS[button.dataset.key] || '');
    el('line').focus();
  };
}
el('stop').onclick = () => stopWatching('');

// A rotation or a resize changes how much of the pane fits, not the pane.
window.addEventListener('resize', () => {
  fitViewerViewport();
  if (!screen) return;
  refit();
  paint();
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitViewerViewport);
  window.visualViewport.addEventListener('scroll', fitViewerViewport);
}
fitViewerViewport();

// A guess the person can correct, so a device still ends up with a name worth
// seeing in `device list` rather than an empty one.
function suggestedName() {
  const agent = navigator.userAgent || '';
  if (/iPad|Tablet/i.test(agent)) return 'iPad';
  if (/Android|iPhone|Mobile/i.test(agent)) return 'phone';
  return 'browser';
}

function confirmationNumber() {
  if (!globalThis.crypto || !crypto.getRandomValues) {
    throw new Error('secure randomness is unavailable');
  }
  const random = new Uint32Array(1);
  crypto.getRandomValues(random);
  return String(random[0] % 1000000).padStart(6, '0');
}

// The version of the daemon, not of this page: the page ships inside that
// binary, so a stale daemon is otherwise invisible from here.
async function start() {
  let session_state = { paired: true, version: '' };
  try {
    session_state = await (await fetch(endpoint('/session'))).json();
  } catch (_) {
    // If this cannot be reached, the stream will not connect either, and the
    // link indicator is the honest place to show that.
  }
  el('version').textContent = session_state.version ? `daemon ${session_state.version}` : '';
  if (!session_state.paired) {
    el('pairing').hidden = false;
    el('name').value = el('name').value || suggestedName();
    codeBoxes[0].focus();
    return;
  }
  document.querySelector('main').hidden = false;
  connect();
}

el('pair').onclick = async () => {
  el('pair-error').textContent = '';
  const code = enteredCode();
  if (code.length !== codeBoxes.length) {
    el('pair-error').textContent = 'Enter all eight code characters.';
    (codeBoxes.find(box => !box.value) || codeBoxes[0]).focus();
    return;
  }
  el('pair').disabled = true;
  try {
    const confirmation = confirmationNumber();
    el('pair-confirmation-value').textContent = confirmation.replace(/(...)/, '$1 ');
    el('pair-confirmation').hidden = false;
    el('pair-error').textContent = 'Waiting for approval in Super-Herdr…';
    const response = await fetch(endpoint('/pair'), {
      method: 'POST',
      body: JSON.stringify({
        code,
        name: el('name').value,
        confirmation,
      }),
    });
    if (response.ok) {
      // The token arrived as a cookie the page cannot read, so there is nothing
      // to store here; reloading picks it up.
      location.reload();
      return;
    }
    el('pair-confirmation').hidden = true;
    el('pair-error').textContent = await response.text();
    if (response.status === 409) {
      el('name').focus();
      el('name').select();
    }
  } catch (_) {
    el('pair-confirmation').hidden = true;
    el('pair-error').textContent = 'Pairing could not be completed. Try again.';
  }
  el('pair').disabled = false;
};

start();
</script>
