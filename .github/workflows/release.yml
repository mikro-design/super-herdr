name: CI and Release

on:
  pull_request:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked --jobs 4

      - name: Run Clippy
        run: cargo clippy --locked --jobs 4 -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: true
            strip: strip

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            strip: aarch64-linux-gnu-strip

          - os: macos-15-intel
            target: x86_64-apple-darwin
            use_cross: false
            strip: strip

          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            strip: strip

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        shell: bash
        run: |
          cargo install cross --locked --version 0.2.5 --jobs 4

      - name: Install Linux ARM64 strip tool
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --locked --jobs 4 --target "${{ matrix.target }}"
          else
            cargo build --release --locked --jobs 4 --target "${{ matrix.target }}"
          fi

      - name: Verify Linux GLIBC baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/super-herdr"
          highest="$(readelf --version-info "${binary}" | sed -n 's/.*Name: \(GLIBC_[0-9.]*\).*/\1/p' | sort -V | tail -n 1)"
          baseline="GLIBC_2.28"
          if [[ -z "${highest}" ]] || [[ "$(printf '%s\n' "${highest}" "${baseline}" | sort -V | tail -n 1)" != "${baseline}" ]]; then
            echo "${{ matrix.target }} requires ${highest:-an unknown GLIBC version}; maximum supported is ${baseline}" >&2
            exit 1
          fi

      - name: Strip binary
        shell: bash
        run: |
          "${{ matrix.strip }}" "target/${{ matrix.target }}/release/super-herdr"

      - name: Create archive and checksum
        id: package
        shell: bash
        run: |
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          package="super-herdr-v${version}-${{ matrix.target }}"
          archive="${package}.tar.gz"
          mkdir "${package}"
          install -m 0755 "target/${{ matrix.target }}/release/super-herdr" "${package}/super-herdr"
          tar -czf "${archive}" "${package}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: super-herdr-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir release-files
          find artifacts -type f -exec cp {} release-files/ \;
          test "$(find release-files -type f | wc -l)" -eq 8

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-files/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
