name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked --jobs 4

      - name: Run Clippy
        run: cargo clippy --locked --jobs 4 --all-targets -- -D warnings

      # Platform-gated code only compiles on its own target. Checking the macOS
      # target from here catches a path that no Linux build would ever reach.
      - name: Lint macOS-only code paths
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          cargo clippy --locked --jobs 4 --target x86_64-apple-darwin --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: true
            strip: strip

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            strip: aarch64-linux-gnu-strip

          - os: macos-15-intel
            target: x86_64-apple-darwin
            use_cross: false
            strip: strip

          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            strip: strip

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        shell: bash
        run: |
          cargo install cross --locked --version 0.2.5 --jobs 4

      - name: Install Linux ARM64 strip tool
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --locked --jobs 4 --target "${{ matrix.target }}"
          else
            cargo build --release --locked --jobs 4 --target "${{ matrix.target }}"
          fi

      - name: Verify Linux GLIBC baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/super-herdr"
          highest="$(readelf --version-info "${binary}" | sed -n 's/.*Name: \(GLIBC_[0-9.]*\).*/\1/p' | sort -V | tail -n 1)"
          baseline="GLIBC_2.28"
          if [[ -z "${highest}" ]] || [[ "$(printf '%s\n' "${highest}" "${baseline}" | sort -V | tail -n 1)" != "${baseline}" ]]; then
            echo "${{ matrix.target }} requires ${highest:-an unknown GLIBC version}; maximum supported is ${baseline}" >&2
            exit 1
          fi

      - name: Strip binary
        shell: bash
        run: |
          "${{ matrix.strip }}" "target/${{ matrix.target }}/release/super-herdr"

      - name: Create archive and checksum
        id: package
        shell: bash
        run: |
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          package="super-herdr-v${version}-${{ matrix.target }}"
          archive="${package}.tar.gz"
          mkdir "${package}"
          install -m 0755 "target/${{ matrix.target }}/release/super-herdr" "${package}/super-herdr"
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE "${package}/"
          tar -czf "${archive}" "${package}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install cargo-deb --locked --version 3.7.0 --jobs 4

      - name: Build Debian package
        id: debian
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) architecture=arm64 ;;
            x86_64-*) architecture=amd64 ;;
            *) echo "unsupported Debian architecture for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          package="super-herdr_${{ steps.package.outputs.version }}-1_${architecture}.deb"
          cargo deb --no-build --no-strip --target "${{ matrix.target }}" --output "${package}"
          # Dependency resolution is architecture-sensitive on the build host,
          # so assert the declared floor instead of trusting whatever it found.
          expected="libc6 (>= 2.28)"
          declared="$(dpkg-deb --field "${package}" Depends)"
          if [[ "${declared}" != "${expected}" ]]; then
            echo "${package} declares Depends '${declared}', expected '${expected}'" >&2
            exit 1
          fi
          echo "package=${package}" >> "${GITHUB_OUTPUT}"

      # Provenance ties each published file to this workflow, commit, and
      # runner. Only tagged builds publish, so only they are attested.
      - name: Attest archive provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest Debian package provenance
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.debian.outputs.package }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: super-herdr-${{ matrix.target }}
          path: |
            super-herdr-v*.tar.gz
            super-herdr_*.deb
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} release-files/ \;
          published="$(find release-files -type f | wc -l)"
          if [[ "${published}" -ne 6 ]]; then
            echo "expected 4 archives and 2 Debian packages, found ${published}" >&2
            exit 1
          fi
          # One signed manifest is easier to verify than one signature per file.
          (cd release-files && sha256sum super-herdr-v*.tar.gz super-herdr_*.deb | sort -k 2 > SHA256SUMS)
          cat release-files/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: the certificate binds the signature to this workflow's
      # OIDC identity, so there is no private key to hold or rotate.
      - name: Sign checksums
        shell: bash
        working-directory: release-files
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: Render package definitions
        shell: bash
        run: |
          scripts/render-packaging.sh \
            "${GITHUB_REF_NAME#v}" \
            release-files/SHA256SUMS \
            "${GITHUB_REPOSITORY}" \
            release-files

      # A definition that restates the wrong checksum publishes a package that
      # will not install, so it is checked before the release exists.
      - name: Verify package definitions
        shell: bash
        run: |
          scripts/verify-packaging.sh "${GITHUB_REF_NAME#v}" release-files

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-files/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
