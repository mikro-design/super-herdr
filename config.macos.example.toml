# Run the Super-Herdr frontend on macOS so selected text is written through
# native pbcopy. Herdr servers and persistent terminal state remain remote.

[transport]
ssh_bin = "ssh"
batch_mode = true
connect_timeout_seconds = 10
command_timeout_seconds = 20

[[targets]]
name = "development"
ssh = "development-host"
discover_sessions = true
session = "work"
socket = "/home/user/.config/herdr/sessions/work/herdr.sock"
herdr_bins = ["/home/user/.local/bin/herdr"]

[[targets]]
name = "build"
ssh = "build-host"
discover_sessions = true
session = "toolchains"
socket = "/home/user/.config/herdr/sessions/toolchains/herdr.sock"
herdr_bins = ["/home/user/.local/bin/herdr"]
