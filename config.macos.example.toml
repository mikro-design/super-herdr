# Run the Super-Herdr frontend on macOS so selected text is written through
# native pbcopy. Herdr servers and persistent terminal state remain remote.
# Prefer `super-herdr target add`; this file documents the equivalent TOML.

[transport]
ssh_bin = "ssh"
batch_mode = true
connect_timeout_seconds = 10
command_timeout_seconds = 20

# Native desktop notifications are opt-in and carry metadata only. Delivery uses
# osascript on macOS; verify with `super-herdr notifications check`.
[notifications]
enabled = false
needs_attention = true
completed = true
disappeared = true
working = false
status_changed = false
minimum_interval_seconds = 5
command_timeout_seconds = 5

[[targets]]
name = "development"
ssh = "development-host"
discover_sessions = true

[[targets]]
name = "build"
ssh = "build-host"
discover_sessions = true
