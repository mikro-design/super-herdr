<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Connect to Super-Herdr</title>
<style>
  :root { color-scheme: dark light; font-family: ui-sans-serif, -apple-system, system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11131a; color: #e6e9f0; }
  main { box-sizing: border-box; width: min(26rem, calc(100% - 2rem)); padding: 1.4rem; background: #171a23; border: 1px solid #262b38; border-radius: .8rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.2rem; }
  p { color: #a8afbf; line-height: 1.45; }
  label, .field-label { display: block; margin-top: 1rem; color: #a8afbf; font-size: .84rem; }
  .field-input { display: block; width: 100%; box-sizing: border-box; margin-top: .3rem; padding: .7rem; font: inherit; color: inherit; background: #11131a; border: 1px solid #343b4d; border-radius: .5rem; }
  .code-boxes { display: flex; gap: .35rem; margin-top: .35rem; }
  .code-box {
    width: min(2.6rem, calc((100vw - 6.5rem) / 8)); height: 3rem; box-sizing: border-box; padding: 0;
    color: inherit; background: #11131a; border: 1px solid #343b4d; border-radius: .5rem;
    text-align: center; text-transform: uppercase; font: 700 1.25rem ui-monospace, monospace;
  }
  .code-box:nth-child(5) { margin-left: .45rem; }
  .code-box:focus { border-color: #60a5fa; outline: 2px solid #2563eb55; }
  button { margin-top: 1rem; padding: .6rem .9rem; font: inherit; color: #fff; background: #2563eb; border: 0; border-radius: .5rem; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #error { min-height: 1.4em; color: #ffb454; }
  #confirmation { padding: .8rem; border: 1px solid #343b4d; border-radius: .5rem; }
  #confirmation strong { display: block; margin-top: .25rem; color: inherit; font: 700 1.5rem ui-monospace, monospace; letter-spacing: .16em; }
  @media (prefers-color-scheme: light) {
    body { background: #f6f7fa; color: #12151c; }
    main { background: #fff; border-color: #dfe3ec; }
    p, label { color: #5b6376; }
    .field-input, .code-box { background: #fff; border-color: #c7ccda; }
  }
</style>
<main>
  <h1>Connect to Super-Herdr</h1>
  <p>Enter the one-time code shown by Super-Herdr. It expires after five minutes.</p>
  <form id="connect">
    <span id="code-label" class="field-label">Code</span>
    <div id="code" class="code-boxes" role="group" aria-labelledby="code-label">
      <input class="code-box" aria-label="Code character 1" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="1" required autofocus>
      <input class="code-box" aria-label="Code character 2" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
      <input class="code-box" aria-label="Code character 3" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
      <input class="code-box" aria-label="Code character 4" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
      <input class="code-box" aria-label="Code character 5" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
      <input class="code-box" aria-label="Code character 6" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
      <input class="code-box" aria-label="Code character 7" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
      <input class="code-box" aria-label="Code character 8" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required>
    </div>
    <label>Name this device
      <input id="name" class="field-input" autocomplete="off" maxlength="48" placeholder="phone">
    </label>
    <button id="submit" type="submit">Connect</button>
  </form>
  <p id="confirmation" hidden>Compare this number with Super-Herdr before approving:
    <strong id="confirmation-value"></strong>
  </p>
  <p id="error" role="alert"></p>
</main>
<script>
const el = id => document.getElementById(id);
const codeBoxes = [...document.querySelectorAll('.code-box')];

const codeCharacters = value => String(value || '')
  .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, codeBoxes.length);
const enteredCode = () => codeBoxes.map(box => box.value).join('');

function fillCode(value) {
  const characters = codeCharacters(value);
  codeBoxes.forEach((box, index) => { box.value = characters[index] || ''; });
  codeBoxes[Math.min(characters.length, codeBoxes.length - 1)].focus();
}

for (const [index, box] of codeBoxes.entries()) {
  box.oninput = () => {
    const characters = codeCharacters(box.value);
    box.value = characters[0] || '';
    if (characters.length > 1) {
      const combined = codeBoxes.slice(0, index).map(one => one.value).join('') + characters;
      fillCode(combined);
    } else if (characters.length === 1 && index + 1 < codeBoxes.length) {
      codeBoxes[index + 1].focus();
    }
  };
  box.onkeydown = event => {
    if (event.key === 'Backspace' && !box.value && index > 0) {
      codeBoxes[index - 1].value = '';
      codeBoxes[index - 1].focus();
      event.preventDefault();
    } else if (event.key === 'ArrowLeft' && index > 0) {
      codeBoxes[index - 1].focus();
      event.preventDefault();
    } else if (event.key === 'ArrowRight' && index + 1 < codeBoxes.length) {
      codeBoxes[index + 1].focus();
      event.preventDefault();
    }
  };
}
el('code').onpaste = event => {
  const pasted = event.clipboardData && event.clipboardData.getData('text');
  if (pasted) {
    event.preventDefault();
    fillCode(pasted);
  }
};

function confirmationNumber() {
  if (!globalThis.crypto || !crypto.getRandomValues) {
    throw new Error('secure randomness is unavailable');
  }
  const random = new Uint32Array(1);
  crypto.getRandomValues(random);
  return String(random[0] % 1000000).padStart(6, '0');
}

function suggestedName() {
  const agent = navigator.userAgent || '';
  if (/iPad|Tablet/i.test(agent)) return 'iPad';
  if (/Android|iPhone|Mobile/i.test(agent)) return 'phone';
  return 'browser';
}

el('name').value = suggestedName();
el('connect').onsubmit = async event => {
  event.preventDefault();
  el('error').textContent = '';
  const code = enteredCode();
  if (code.length !== codeBoxes.length) {
    el('error').textContent = 'Enter all eight code characters.';
    (codeBoxes.find(box => !box.value) || codeBoxes[0]).focus();
    return;
  }
  el('submit').disabled = true;
  try {
    const confirmation = confirmationNumber();
    el('confirmation-value').textContent = confirmation.replace(/(...)/, '$1 ');
    el('confirmation').hidden = false;
    el('error').textContent = 'Waiting for approval in Super-Herdr…';
    const response = await fetch('/_bridge/pair', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        code,
        name: el('name').value,
        confirmation,
      }),
    });
    const route = response.headers.get('x-super-herdr-route');
    if (response.ok && route) {
      location.replace(`${route}/`);
      return;
    }
    el('confirmation').hidden = true;
    el('error').textContent = await response.text() || 'That code was not accepted.';
  } catch (_) {
    el('confirmation').hidden = true;
    el('error').textContent = 'The bridge could not be reached. Try again.';
  }
  el('submit').disabled = false;
};
</script>
