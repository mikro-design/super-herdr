# Super-Herdr runs on the desktop and connects to each Herdr host. For a target
# on the same machine, omit `ssh` and the Herdr command is executed directly.
# Prefer `super-herdr target add`; this file documents the equivalent TOML.

[transport]
ssh_bin = "ssh"
batch_mode = true
connect_timeout_seconds = 10
command_timeout_seconds = 20

# Native desktop notifications are opt-in and carry metadata only. Toggle them
# with `super-herdr notifications enable` and verify with `notifications check`.
[notifications]
enabled = false
needs_attention = true
completed = true
disappeared = true
working = false
status_changed = false
# Also alert paired devices, under the same filters, coalescing and rate limit.
# Separate from `enabled`, which is this machine's own desktop notifications:
# wanting alerts on a phone is not the same request as wanting them on the
# laptop you are sitting at. A device still has to grant its browser's
# notification permission and turn Alerts on in the page, and today it is
# alerted while that page is running — see ARCHITECTURE.md.
devices = false
minimum_interval_seconds = 5
command_timeout_seconds = 5

# What the daemon will move on someone's behalf. The ceiling bounds the target
# host's disk rather than this process — a transfer is relayed as it arrives,
# never held whole — and it is separate from the clipboard's own 32 MiB limit.
[transfers]
max_bytes = 1073741824

# One-tap replies offered on a paired device.
#
# These are replies you decided you send often, not choices read off a screen.
# Herdr's API reports that an agent is ready for input, never what it is
# asking, so Super-Herdr will not show a Yes button because a terminal looked
# like a yes/no prompt — that would be a keystroke sent on a pattern match.
#
# Leaving this out offers Yes, No, Continue and Retry. An empty list
# (quick_replies = []) offers none. At most eight, each sending 1 to 256 bytes
# of text with no control characters: Enter, Escape, Tab and Ctrl-C are their
# own keys, and `submit` is what appends the Enter.
#[[quick_replies]]
#label = "Approve"
#send = "approve"
#submit = true      # append Enter; on by default
#confirm = false    # ask for a second tap before sending

[[targets]]
name = "development"
ssh = "development-host"
discover_sessions = true
# Places the browser's file picker may look on this host. Absent means it
# offers nothing for this target, which is the default: a browsing surface that
# starts at / is one nobody asked for. At most eight, each an absolute path
# with no '..'. This bounds browsing and searching and deliberately not
# reading — a paired device already holds pane control and can read anything
# its user can, so a root is a place to look rather than a permission.
#roots = ["/srv/build", "/home/example/work"]
# Local groupings for filtering — work, home, lab, a pod name. A tag never
# reaches a host and never takes part in identity: two hosts tagged "work" are
# still two entirely separate targets.
#tags = ["work", "lab"]
# Optional overrides:
#session = "default"
#socket = "/absolute/path/to/herdr.sock"
#herdr_bins = ["/absolute/path/to/herdr"]

#[[targets]]
#name = "build"
#ssh = "build-host"
#discover_sessions = true
