# Super-Herdr runs on the desktop and connects to each Herdr host. For a target
# on the same machine, omit `ssh` and the Herdr command is executed directly.
# Prefer `super-herdr target add`; this file documents the equivalent TOML.

[transport]
ssh_bin = "ssh"
batch_mode = true
connect_timeout_seconds = 10
command_timeout_seconds = 20

# Native desktop notifications are opt-in and carry metadata only. Toggle them
# with `super-herdr notifications enable` and verify with `notifications check`.
[notifications]
enabled = false
needs_attention = true
completed = true
disappeared = true
working = false
status_changed = false
minimum_interval_seconds = 5
command_timeout_seconds = 5

# What the daemon will move on someone's behalf. The ceiling bounds the target
# host's disk rather than this process — a transfer is relayed as it arrives,
# never held whole — and it is separate from the clipboard's own 32 MiB limit.
[transfers]
max_bytes = 1073741824

[[targets]]
name = "development"
ssh = "development-host"
discover_sessions = true
# Optional overrides:
#session = "default"
#socket = "/absolute/path/to/herdr.sock"
#herdr_bins = ["/absolute/path/to/herdr"]

#[[targets]]
#name = "build"
#ssh = "build-host"
#discover_sessions = true
