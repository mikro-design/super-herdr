[package]
name = "super-herdr"
version = "0.1.0"
edition = "2024"
publish = false
description = "A multi-host federation client for Herdr sessions"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
vt100 = "0.16.2"
