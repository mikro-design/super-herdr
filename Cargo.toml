[package]
name = "super-herdr"
version = "0.7.9"
edition = "2024"
publish = false
description = "A multi-host federation client for Herdr sessions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mikro-design/super-herdr"

[package.metadata.deb]
maintainer = "Mikro Design <mikrodesign@proton.me>"
copyright = "2026 Mikro Design"
license-file = "LICENSE-MIT"
section = "utils"
priority = "optional"
# Automatic resolution reads the build host's symbol files, which overstates the
# floor on amd64 and yields nothing at all for a cross-built arm64 binary. CI
# enforces a GLIBC 2.28 baseline, so state that same floor for every
# architecture.
depends = "libc6 (>= 2.28)"
extended-description = """
Super-Herdr is a desktop frontend that federates running Herdr sessions across several hosts into one terminal UI, with qualified identities, per-target failure isolation, agent attention tracking, and a local clipboard bridge."""
assets = [
    ["target/release/super-herdr", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/super-herdr/README.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/super-herdr/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/super-herdr/LICENSE-APACHE", "644"],
]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
# Rendering a pairing code as a QR. Taken rather than written because the parts
# that are easy to get subtly wrong — Reed-Solomon and mask selection — fail by
# producing a code that scans on one phone and not another, which looks like
# working software to whoever holds the phone that works. Zero transitive
# dependencies, with defaults or without; `default-features = false` drops the
# image, svg and pic renderers, which are the only things here that would ever
# grow a tree.
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
vt100 = "0.16.2"
